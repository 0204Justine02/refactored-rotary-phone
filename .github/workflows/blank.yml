name: Build JUSTINEHUB APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Prepare website
      - name: Prepare website
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/

          [ -f app.js ] && cp app.js www/ || true
          [ -f style.css ] && cp style.css www/ || true
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f service-worker.js ] && cp service-worker.js www/ || true

          # TineWorld
          [ -f tineworld_v5.js ] && cp tineworld_v5.js www/ || true
          [ -f tineworld.js ] && cp tineworld.js www/ || true

          # Images
          [ -f justine-hub-logo.png ] && cp justine-hub-logo.png www/ || true
          [ -f icon-192.png ] && cp icon-192.png www/ || true
          [ -f icon-512.png ] && cp icon-512.png www/ || true

          # Audio
          [ -f chill_background.wav ] && cp chill_background.wav www/ || true
          [ -f chill_background.mp3 ] && cp chill_background.mp3 www/ || true

          # App assets
          if [ -d app ]; then
            cp -r app www/app
          fi

          echo "===== WEBSITE FILES ====="
          find www -type f | sort

      # 6. Create Capacitor project
      - name: Create package
        shell: bash
        run: |
          set -e

          npm init -y

          npm install \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6

      # 7. Create Android project
      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android

          npx cap init \
            "JUSTINEHUB" \
            "com.justinehub.app" \
            --web-dir www

          npx cap add android

      # 8. Android configuration
      - name: Configure Android
        shell: bash
        run: |
          set -e

          STRINGS="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS" ]; then
            sed -i \
              's/<string name="app_name">.*<\/string>/<string name="app_name">JUSTINEHUB<\/string>/' \
              "$STRINGS" || true
          fi

      # 9. Copy app icon
      - name: Set app icon
        shell: bash
        run: |
          if [ -f justine-hub-logo.png ]; then
            mkdir -p android/app/src/main/res/drawable
            cp justine-hub-logo.png \
              android/app/src/main/res/drawable/justine_hub_logo.png
          fi

      # 10. Sync Capacitor
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e
          npx cap sync android

      # 11. Build APK
      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 12. Copy APK to repository root
      - name: Prepare direct download APK
        shell: bash
        run: |
          set -e

          test -f android/app/build/outputs/apk/debug/app-debug.apk

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            JUSTINEHUB.apk

          ls -lh JUSTINEHUB.apk

      # 13. Upload APK as Actions artifact too
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JUSTINEHUB-APK
          path: JUSTINEHUB.apk
          if-no-files-found: error

      # 14. Commit APK directly to repository
      - name: Commit APK to repository
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JUSTINEHUB.apk

          if git diff --cached --quiet; then
            echo "APK unchanged."
          else
            git commit -m "Update JUSTINEHUB APK"
            git push
          fi
